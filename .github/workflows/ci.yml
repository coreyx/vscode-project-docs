# Lint, build and test on every platform Project Docs supports (REQ-16.1), and enforce the
# coverage thresholds in vitest.config.ts (REQ-21.1).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch makes the previous run's results moot, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest supported Node and the current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm run build
      # The CLI is a single bundled file; make sure it actually starts.
      - run: node packages/cli/dist/project-docs.mjs --version
      - run: npm run coverage
      - name: Upload coverage report
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: ignore

  extension:
    name: extension integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung VS Code would otherwise hold the runner for hours; the suite takes about 3 minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # VS Code needs a display; Linux runners have none, so run it under a virtual one.
      - name: Run extension tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode --workspace project-docs --if-present
      - name: Run extension tests
        if: runner.os != 'Linux'
        run: npm run test:vscode --workspace project-docs --if-present

  wsl:
    name: core tests inside WSL
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl ca-certificates rsync xz-utils
      # The official tarball installs in seconds, where the apt route took many minutes in WSL.
      # setup-wsl runs commands as root, so no sudo.
      - name: Install Node 22 in WSL
        run: |
          base=https://nodejs.org/dist/latest-v22.x
          file=$(curl -fsSL "$base/SHASUMS256.txt" | grep -o 'node-v[0-9.]*-linux-x64.tar.xz' | head -1)
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/SHASUMS256.txt" | grep " $file\$" | sha256sum -c -
          tar -xJf "$file" -C /usr/local --strip-components=1
          node --version
      # Tests run from the WSL filesystem, with a second fixture folder on the Windows drive, so
      # they cover a repo in WSL linked to a vault on C: (REQ-2.0.4, REQ-4.0.2).
      - name: Copy the checkout into the WSL filesystem
        run: rsync -a --exclude node_modules ./ ~/project-docs/
      - name: Test
        env:
          PROJECT_DOCS_TEST_WINDOWS_DIR: /mnt/c/project-docs-test
          WSLENV: PROJECT_DOCS_TEST_WINDOWS_DIR/u
        run: |
          mkdir -p "$PROJECT_DOCS_TEST_WINDOWS_DIR"
          cd ~/project-docs
          npm ci
          npm run build
          npm test
